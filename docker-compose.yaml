services:
  service:
    build:
      context: .
      target: service
    ports:
      - "8080:8080"
    # Bring the schema up to date before serving (a no-op when already at head).
    command: sh -c "alembic upgrade head && uvicorn openapi_server.main:app --host 0.0.0.0 --port 8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-please}
      DATABASE_URL: postgresql+psycopg://tickets:tickets@postgres:5432/tickets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    # Localhost only: lets host-side tools (alembic, uvicorn without Docker) connect.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

volumes:
  pgdata: